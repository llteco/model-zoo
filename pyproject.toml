[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zoo"
dynamic = ["version", "description"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hyperonnx>=1.0.3",
    "onnxifier>=2.1.0",
    "prettytable>=3.17.0",
    "tensordict>=0.11.0",
    "torchrl>=0.11.1",
    "transformers>=5.5",   # for Gemma4
]

[project.scripts]
zoo-bench = "zoo.bench.__main__:main"
zoo-export = "zoo.export.__main__:main"
zoo-quant = "zoo.quant.__main__:main"
zoo-trace = "zoo.trace.__main__:main"

[project.optional-dependencies]
cpu = [
    "torch",
    "torchaudio",
    "torchvision",
    "triton-windows; sys_platform == 'win32'",
]
cuda = [
    "cuda-python>=12.9.4",
    "torch>2.11",
    "torchaudio",
    "torchvision",
    "triton-windows; sys_platform == 'win32'",
    "nvidia-modelopt[hf]>=0.40",
]
xpu = ["torch", "torchaudio", "torchvision", "pytorch-triton-xpu"]

[dependency-groups]
dev = ["pyright>=1.1.408", "ruff>=0.15.8"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "-s"]

[tool.pylint."MAIN"]
ignore-paths = []

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "logging-fstring-interpolation",
    "missing-module-docstring",
    "no-member",
    "no-name-in-module",
    "fixme",
    "R",
    "I",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda130", extra = "cuda" },
    { index = "pytorch-xpu", extra = "xpu" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda130", extra = "cuda" },
    { index = "pytorch-xpu", extra = "xpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda130", extra = "cuda" },
    { index = "pytorch-xpu", extra = "xpu" },
]
pytorch-triton-xpu = { index = "pytorch-xpu" }
hyperonnx = { path = "../HyperONNX", editable = true }
onnxifier = { path = "../ONNXifier", editable = true }
nvidia-modelopt = { git = "https://github.com/NVIDIA/Model-Optimizer", branch = "main" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "xpu" }, { extra = "cuda" }]]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]
ignore = ["E203", "E231", "E241"]
